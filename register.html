<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create an Evolve Mart account.">
    <title>Evolve Mart | Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="mystyle.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-bag-check-fill me-2"></i>Evolve Mart</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="site-topbar container-fluid text-white sticky-top">
        <div class="container">
            <div class="row align-items-center g-2 py-2">
                <div class="col-md-3 brand-mark text-center text-md-start">Fast Finds. Fair Prices.</div>
                <div class="col-md-6">
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search products"
                            aria-label="Search products">
                        <button class="btn btn-warning fw-semibold" type="submit">Search</button>
                    </form>
                </div>
                <div class="col-md-3 d-flex justify-content-center justify-content-md-end gap-2">
                    <a href="login.html" class="site-icon-link text-warning text-decoration-none" aria-label="Login"><i
                            class="bi bi-box-arrow-in-left fs-4"></i></a>
                    <a href="register.html" class="site-icon-link text-warning text-decoration-none" aria-label="Register"><i
                            class="bi bi-person-plus fs-4"></i></a>
                    <a href="cart.html" class="site-icon-link text-warning text-decoration-none" aria-label="Cart"><i
                            class="bi bi-cart fs-4"></i></a>
                </div>
            </div>
        </div>
    </div>

    <main class="auth-page py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-11 col-lg-8">
                    <form class="auth-card shadow-lg rounded-4 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="feature-icon mb-3"><i class="bi bi-person-plus"></i></span>
                            <h1 class="h2 text-secondary-emphasis">Create your account</h1>
                            <p class="text-secondary mb-0">Save your details for faster checkout and easier order tracking.</p>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="registerName" placeholder="Full name">
                                    <label for="registerName">Full name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="date" class="form-control" id="registerDob" placeholder="Date of birth">
                                    <label for="registerDob">Date of birth</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label d-block">Gender</label>
                                <div class="d-flex flex-wrap gap-4 bg-white border rounded-3 p-3">
                                    <div class="form-check">
                                        <input type="radio" value="m" id="genderMale" class="form-check-input"
                                            name="gender" checked>
                                        <label for="genderMale" class="form-check-label">Male</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="radio" value="f" id="genderFemale" class="form-check-input"
                                            name="gender">
                                        <label for="genderFemale" class="form-check-label">Female</label>
                                    </div>
                                    <div class="form-check">
                                        <input type="radio" value="o" id="genderOther" class="form-check-input"
                                            name="gender">
                                        <label for="genderOther" class="form-check-label">Other</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <textarea class="form-control" id="registerAbout" placeholder="About yourself"></textarea>
                                    <label for="registerAbout">About yourself</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select" id="registerAddress">
                                        <option selected>Choose your city</option>
                                        <option>Kathmandu</option>
                                        <option>Bhaktapur</option>
                                        <option>Lalitpur</option>
                                        <option>Birgunj</option>
                                        <option>Pokhara</option>
                                    </select>
                                    <label for="registerAddress">Address</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="profilePhoto" class="form-label">Photo</label>
                                <input type="file" class="form-control" id="profilePhoto">
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="email" class="form-control" id="registerEmail" placeholder="name@example.com">
                                    <label for="registerEmail">Email address</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="registerPassword" placeholder="Password">
                                    <label for="registerPassword">Password</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-check mt-3">
                            <input type="checkbox" class="form-check-input" id="termsCheck">
                            <label for="termsCheck" class="form-check-label">I accept the terms and conditions.</label>
                        </div>

                        <button class="btn btn-success w-100 py-2 mt-3" type="submit">Register</button>

                        <p class="text-center mt-3 mb-0">Already have an account?
                            <a href="login.html" class="text-decoration-none fw-semibold">Login</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <p class="mb-0">&copy; Copyright 2026 Evolve Mart.</p>
            <div class="d-flex gap-3">
                <a class="footer-link" href="index.html">Home</a>
                <a class="footer-link" href="products.html">Products</a>
                <a class="footer-link" href="contact.html">Contact</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
