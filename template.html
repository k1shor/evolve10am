<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reusable Evolve Mart page template.">
    <title>Evolve Mart | Template</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="mystyle.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-bag-check-fill me-2"></i>Evolve Mart</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="site-topbar container-fluid text-white sticky-top">
        <div class="container">
            <div class="row align-items-center g-2 py-2">
                <div class="col-md-3 brand-mark text-center text-md-start">Fast Finds. Fair Prices.</div>
                <div class="col-md-6">
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search products"
                            aria-label="Search products">
                        <button class="btn btn-warning fw-semibold" type="submit">Search</button>
                    </form>
                </div>
                <div class="col-md-3 d-flex justify-content-center justify-content-md-end gap-2">
                    <a href="login.html" class="site-icon-link text-warning text-decoration-none" aria-label="Login"><i
                            class="bi bi-box-arrow-in-left fs-4"></i></a>
                    <a href="register.html" class="site-icon-link text-warning text-decoration-none" aria-label="Register"><i
                            class="bi bi-person-plus fs-4"></i></a>
                    <a href="cart.html" class="site-icon-link text-warning text-decoration-none" aria-label="Cart"><i
                            class="bi bi-cart fs-4"></i></a>
                </div>
            </div>
        </div>
    </div>

    <main class="main-shell container py-5">
        <div class="bg-white rounded-4 shadow-sm p-5 text-center">
            <span class="badge badge-soft rounded-pill mb-3">Reusable page</span>
            <h1 class="section-title">Start new content here</h1>
            <p class="text-secondary mb-0">This template keeps the site header, search bar, footer, and shared styling ready
                for the next Evolve Mart page.</p>
        </div>
    </main>

    <footer class="bg-dark text-white py-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <p class="mb-0">&copy; Copyright 2026 Evolve Mart.</p>
            <div class="d-flex gap-3">
                <a class="footer-link" href="index.html">Home</a>
                <a class="footer-link" href="products.html">Products</a>
                <a class="footer-link" href="contact.html">Contact</a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
